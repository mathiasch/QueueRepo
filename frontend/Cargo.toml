[package]
name = "queued-web"
version = "0.2.0"
edition = "2021"
description = "Queue web frontend (Leptos CSR, compiled to WebAssembly, built with Trunk)"
publish = false

# Own workspace: the backend workspace must not build Leptos/WASM.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "queued-web"
path = "src/main.rs"

[dependencies]
queued-api = { path = "../backend/crates/api" }
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock", "wasmbind"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# Pinned exactly: the wasm-bindgen CLI used by Trunk must have the same version (Trunk.toml).
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
  "Blob", "Document", "DomTokenList", "Element", "Event", "EventSource", "EventTarget", "File", "FileList",
  "HtmlDocument", "HtmlDetailsElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "KeyboardEvent",
  "Location", "MediaQueryList", "MessageEvent", "Navigator", "Notification", "NotificationPermission",
  "PushManager", "PushSubscription", "PushSubscriptionOptionsInit", "ServiceWorkerContainer",
  "ServiceWorkerRegistration", "Storage", "Url", "UrlSearchParams", "Window", "History", "ScrollIntoViewOptions",
  "ScrollBehavior", "ScrollLogicalPosition", "FocusOptions", "NodeList", "Clipboard",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
