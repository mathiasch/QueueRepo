[build]
target = "index.html"
dist = "dist"
public_url = "/"
# Tool versions are pinned: wasm-bindgen must match the crate (Cargo.toml),
# wasm-opt is downloaded by Trunk if not installed in this exact version.
[tools]
wasm_bindgen = "0.2.130"
wasm_opt = "version_131"

[serve]
addresses = ["127.0.0.1"]
port = 5173

[[proxy]]
backend = "http://127.0.0.1:8080/api/"
