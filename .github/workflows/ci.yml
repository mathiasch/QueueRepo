name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://queued:queued@localhost:5432/queued

jobs:
  rust:
    name: Rust – fmt, clippy, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: queued, POSTGRES_PASSWORD: queued, POSTGRES_DB: queued }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (Rust/Leptos) – fmt, clippy (wasm + native), unit tests, Trunk build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: frontend }
      # wasm-bindgen-cli must match the version pinned in frontend/Cargo.toml.
      - run: cargo install --locked trunk@0.22.1 wasm-bindgen-cli@0.2.130
      - run: cargo fmt --all -- --check
      - run: cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: trunk build --release

  e2e:
    name: System + E2E (Playwright, real binaries)
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: queued, POSTGRES_PASSWORD: queued, POSTGRES_DB: queued }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_ADMIN_URL: postgres://queued:queued@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "backend\nfrontend" }
      - run: cargo install --locked trunk@0.22.1 wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/report, retention-days: 7 }
