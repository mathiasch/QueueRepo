[package]
name = "queued-runner"
version.workspace = true
edition.workspace = true
description = "Unprivileged executor: owns project git workspaces and runs agents in rootless sandboxes"

[lib]
path = "src/lib.rs"

[[bin]]
name = "queued-runner"
path = "src/main.rs"

[dependencies]
queued-common = { path = "../common" }
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream = "0.1"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
futures.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
# Egress proxy (WP02): request parsing, TLS for read-only inspection.
httparse = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
sha2 = "0.10"
memchr = "2"

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
