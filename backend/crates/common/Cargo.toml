[package]
name = "queued-common"
version.workspace = true
edition.workspace = true
description = "Wire protocol between the queue app and the runner"

[features]
# Secret scanner and diff analysis (runner + app; not needed in the WASM frontend).
scan = ["dep:regex", "dep:sha2"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
